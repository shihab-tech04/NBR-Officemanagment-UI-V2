name: WS04 isolated W5 engine source integrity (no deploy)
on:
  push:
    branches:
      - ws04/w5-tax-engine-review-20261022
  pull_request:
    paths:
      - 'ws04/w5-candidate/**'
      - '.github/workflows/ws04-w5-engine-source-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact reviewed candidate source and test checksums
        shell: bash
        run: |
          echo 'a6144c4609bea5c39ec217e9b8c8aaa85fb4f69c93cd4b6d4f410815e6a8d97b  ws04/w5-candidate/supabase/functions/nbr-tax-engine/index.ts' | sha256sum -c -
          echo '328ec5c4a9720584e2616f21ba386668eab79845ddb1856c02956447a1427b27  ws04/w5-candidate/tests/engine_boundary.node.mjs' | sha256sum -c -
          echo '8ec2d535d06f5cd6d710eaed0b00d547bc83efd9f90adbe7e148f55e5b9739d7  ws04/w5-candidate/tests/temporal_guard.node.mjs' | sha256sum -c -
          echo '16c3015603b59934006d32f75d7ed685673682503b0616717d1e9faf420fd20a  ws04/w5-candidate/tests/verify_frozen_registry.mjs' | sha256sum -c -
      - name: Self-test offline private frozen registry verifier (synthetic only)
        run: node ws04/w5-candidate/tests/verify_frozen_registry.mjs --self-test
      - name: Verify cross-income-year transaction denial using actual W5 Edge handler (isolated mocks)
        shell: bash
        run: |
          node --test ws04/w5-candidate/tests/temporal_guard.node.mjs
          node --test ws04/w5-candidate/tests/ownership_gate.node.mjs
          node --test ws04/w5-candidate/tests/audit_trace_guard.node.mjs
          echo 'Isolated temporal and rule-selection input guard cases. NOT source-law, private frozen-registry runtime, PostgreSQL/Auth or Agent certification.'
      - name: Validate official SRO268 source-intake HOLD and negative drift cases
        run: |
          node --test ws04/w5-candidate/tests/legal_source_hold.node.mjs
          echo 'Review-only official source lineage; Gazette PDF digest, WS01 legal signoff and rule applicability are NOT certified.'
      - name: Validate 2014-2017-2023-2025 SRO158 historical source chain (review-only)
        run: |
          node --test ws04/w5-candidate/tests/sro158_2014_chain.node.mjs
          echo 'Source-graph integrity only: original PDF SHA, savings, revival and AY/IY effects remain unverified.'
      - name: Validate Edge TypeScript syntax and non-activation boundaries (not statutory tests)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {stripTypeScriptTypes} from 'node:module';
          import {Script} from 'node:vm';
          const s=readFileSync('ws04/w5-candidate/supabase/functions/nbr-tax-engine/index.ts','utf8');
          const js=stripTypeScriptTypes(s.replace(/^import \{ createClient \} from .*;$/m, 'const { createClient } = __testDeps;'));
          new Script(js);
          const required=[
            'NBR_TAX_EXECUTION_ENABLED',
            'nbr_authorize_citizen_evaluation',
            'nbr_reserve_citizen_evaluation',
            'nbr_commit_evaluation_versioned_candidate',
            'NBR_W5_CANONICAL_UTF8_V1',
            'p_trace_bytes: canonicalAuditTrace',
            'expectedRuleSetHash',
            'expectedParameterRevision',
            'CREDIT_EVIDENCE_NOT_VERIFIED',
            'FIXED_DECIMAL_10_TRUNCATE_TOWARD_ZERO',
            'NON_SQL_STATUTORY_CALCULATOR_DISABLED',
          ];
          for (const token of required) if (!s.includes(token)) throw Error('Required boundary missing: '+token);
          if (s.includes('"Access-Control-Allow-Origin": "*"')) throw Error('Unrestricted CORS');
          console.log('PASS: exact candidate syntax/integrity/static security boundaries');
          console.log('NOT RUN IN CI: original 366-rule frozen library and Auth/PG17 fixture are not in public repository');
          console.log('The private frozen-registry runtime is executed offline only; this CI does not certify original Agent or legal law');
          NODE
