name: TaxPay banner CMS integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/pages/administration-requests/ContentManagementPage*'
      - 'src/app/pages/administration-requests/ImageCropDialog*'
      - 'src/app/pages/administration-requests/SiteLogoPanel*'
      - 'src/assets/korbritto-brand-locked.svg'
      - 'src/styles/content-management.css'
      - '.github/workflows/banner-cms-integration.yml'
permissions:
  contents: read
jobs:
  cms:
    name: Secure CMS editor and image crop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify protected CMS and production crop contracts
        run: npx vitest run src/app/pages/administration-requests/ContentManagementPage.test.tsx src/app/pages/administration-requests/ImageCropDialog.test.tsx src/app/components/auth/LoginForm.test.tsx src/app/pages/administration-requests/SiteLogoPanel.test.tsx
      - name: Compile exact approved Office design
        run: npm run build
        env:
          BASE_PATH: /NBR-Officemanagment-UI-V2/
          VITE_TAXPAY_CMS_SUPABASE_URL: https://eyqhoavnitkrajvyqvxn.supabase.co
          VITE_TAXPAY_CMS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZRyWCWCOWBmsg7b9qTseUg_CFlhl3Id
