name: Rules and Calculation UI QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: /NBR-Officemanagment-UI-V2/
          VITE_NBR_RULES_PUBLISHABLE_KEY: 'sb_publishable_ZwFis7EMwMNdqZNsTi5CKA_8Rs0JNgP'
      - run: npm test -- --reporter=default
      - run: npx tsx src/app/i18n/validateLocales.ts
      - name: Verify live NBR replacement Rules gateway security and browser origin
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = 'https://gtorruuhvohafapctxym.supabase.co/functions/v1/nbr-rules-office-gateway'
          origin = 'https://shihab-tech04.github.io'
          def call(path, method='GET'):
              request = Request(base + '/' + path, method=method, headers={'Origin':origin,'Accept':'application/json'})
              try:
                  with urlopen(request,timeout=25) as r:
                      return r.status, dict(r.headers.items()), r.read()
              except HTTPError as e:
                  return e.code, dict(e.headers.items()), e.read()
          preflight = Request(base+'/public/years',method='OPTIONS',headers={'Origin':origin,'Access-Control-Request-Method':'GET'})
          with urlopen(preflight,timeout=25) as res:
              assert res.status == 204
              assert res.headers.get('Access-Control-Allow-Origin') == origin
          status, headers, raw = call('public/years')
          assert status == 200
          assert headers.get('Access-Control-Allow-Origin') == origin
          payload = json.loads(raw)
          assert any(y['assessmentYear']=='2026-27' for y in payload['years'])
          status, headers, raw = call('years')
          assert status == 401, (status,raw[:150])
          assert call('rules?year=2026-27')[0] == 401
          assert call('session/auto', method='POST')[0] == 401
          runtime_url = 'https://gtorruuhvohafapctxym.supabase.co/functions/v1/nbr-tax-engine/status'
          with urlopen(Request(runtime_url,headers={'Origin':origin,'Accept':'application/json'}),timeout=25) as response:
              assert response.status == 200
              live = json.load(response)
          import re
          assert live.get('activeYear') == '2026-27'
          assert live.get('incomeYear') == '2025-26'
          assert live.get('ruleCount') == live.get('runtimeBindingCount') == 366
          assert live.get('missingRuntimeBindingCount') == live.get('unhandledRuleCount') == 0
          assert live.get('allRuleNodesMapped') is True
          assert live.get('sourceRegistryVersion') == 'FINAL_2026_09_30'
          assert re.fullmatch(r'[0-9a-f]{64}',live.get('syncFingerprint',''))
          print('PASS: Office and Citizen share canonical SQL runtime identity; protected Rules APIs deny anonymous access')

          PY

  off-github-backup-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create and independently test repository history bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git fetch --all --tags --prune
          git bundle create backup/full-history.bundle --all
          git bundle verify backup/full-history.bundle
          git clone --quiet --mirror backup/full-history.bundle /tmp/restored-nbr-office.git
          git --git-dir=/tmp/restored-nbr-office.git fsck --full --no-reflogs
          git --git-dir=/tmp/restored-nbr-office.git cat-file -e "${GITHUB_SHA}^{commit}"
          printf '%s\n' "source_repository=${GITHUB_REPOSITORY}" "source_commit=${GITHUB_SHA}" "mirror_restore=PASS" > backup/manifest.txt
          sha256sum backup/full-history.bundle > backup/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nbr-office-full-history-cutover-backup
          path: backup/
          retention-days: 7
