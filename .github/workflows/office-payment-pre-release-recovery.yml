name: Office payment mirror verified pre-release recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261111163000_taxpay_return_only_office_mirror.sql'
      - 'tests/integration/officeReturnCombinedMirror.sql'
      - '.github/workflows/story1-office-ci.yml'
      - '.github/workflows/office-payment-pre-release-recovery.yml'
permissions:
  contents: read
jobs:
  source-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Build checksum-verified full-history and source archives
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          mkdir -p recovery
          git bundle create recovery/office-pre-release-history.bundle --all
          git bundle verify recovery/office-pre-release-history.bundle
          git archive --format=tar "$BASE_SHA" | gzip -n > recovery/office-pre-release-source.tar.gz
          printf '%s\n' "$BASE_SHA" > recovery/BASE_SHA
          (cd recovery && sha256sum office-pre-release-history.bundle office-pre-release-source.tar.gz BASE_SHA > SHA256SUMS)
          (cd recovery && sha256sum -c SHA256SUMS)
      - name: Restore outside original checkout and verify commit and source
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat recovery/BASE_SHA)"
          mkdir -p "$RUNNER_TEMP/office-restore"
          git clone --mirror recovery/office-pre-release-history.bundle "$RUNNER_TEMP/office-restore/full.git"
          git --git-dir="$RUNNER_TEMP/office-restore/full.git" cat-file -e "$BASE_SHA^{commit}"
          git --git-dir="$RUNNER_TEMP/office-restore/full.git" fsck --full --strict
          mkdir -p "$RUNNER_TEMP/office-restore/source"
          tar -xzf recovery/office-pre-release-source.tar.gz -C "$RUNNER_TEMP/office-restore/source"
          test -f "$RUNNER_TEMP/office-restore/source/package.json"
          echo "OFFICE_PRE_RELEASE_RESTORE_PASS=$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: office-return-mirror-pre-release-${{ github.event.pull_request.number }}
          path: recovery/
          retention-days: 14
          if-no-files-found: error
