name: Verified pre-release source recovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create source and full-history recovery archives
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          mkdir -p recovery
          git bundle create "recovery/pre-release-history.bundle" --all
          git bundle verify "recovery/pre-release-history.bundle"
          git archive --format=tar "$BASE_SHA" | gzip -9 > "recovery/pre-release-source.tar.gz"
          printf '%s\n' "$BASE_SHA" > recovery/BASE_SHA
          (cd recovery && sha256sum pre-release-history.bundle pre-release-source.tar.gz BASE_SHA > SHA256SUMS)
          (cd recovery && sha256sum --check SHA256SUMS)
      - name: Independent git bundle restore test
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat recovery/BASE_SHA)"
          mkdir -p /tmp/pre-release-restore
          git clone --mirror recovery/pre-release-history.bundle /tmp/pre-release-restore/restore.git
          git --git-dir=/tmp/pre-release-restore/restore.git cat-file -e "$BASE_SHA^{commit}"
          git --git-dir=/tmp/pre-release-restore/restore.git fsck --full --strict
          mkdir -p /tmp/pre-release-restore/source
          tar -xzf recovery/pre-release-source.tar.gz -C /tmp/pre-release-restore/source
          test -f /tmp/pre-release-restore/source/package.json
          echo "RECOVERY_RESTORE_PASS_SHA=$BASE_SHA"
      - name: Generate separately transferable off-GitHub backup shards
        shell: bash
        run: |
          set -euo pipefail
          tar -cf /tmp/pre-release-offsite.tar -C recovery \
            pre-release-history.bundle pre-release-source.tar.gz BASE_SHA SHA256SUMS
          mkdir -p offsite-shards
          split -b 2m -d -a 2 /tmp/pre-release-offsite.tar offsite-shards/part-
          test "$(find offsite-shards -name 'part-*' -type f | wc -l)" -eq 12
          cat offsite-shards/part-* > /tmp/offsite-reconstructed.tar
          cmp -s /tmp/pre-release-offsite.tar /tmp/offsite-reconstructed.tar
          sha256sum /tmp/pre-release-offsite.tar | sed 's|/tmp/pre-release-offsite.tar|offsite-joined.tar|' > offsite-shards/WHOLE_SHA256SUMS
          echo "PASS: independently reconstructable twelve-part pre-release archive"
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-00
          path: offsite-shards/part-00
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-01
          path: offsite-shards/part-01
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-02
          path: offsite-shards/part-02
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-03
          path: offsite-shards/part-03
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-04
          path: offsite-shards/part-04
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-05
          path: offsite-shards/part-05
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-06
          path: offsite-shards/part-06
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-07
          path: offsite-shards/part-07
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-08
          path: offsite-shards/part-08
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-09
          path: offsite-shards/part-09
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-10
          path: offsite-shards/part-10
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-part-11
          path: offsite-shards/part-11
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: office-offsite-history-sha256-manifest
          path: offsite-shards/WHOLE_SHA256SUMS
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pre-release-recovery-${{ github.event.pull_request.number || github.run_id }}
          path: recovery/
          retention-days: 1
          if-no-files-found: error
