name: Office correction review - disposable PostgreSQL 17

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261029170000_office_correction_review.sql'
      - 'tests/integration/officeCorrectionReviewFixture.sql'
      - 'tests/integration/officeCorrectionReview.sql'
      - '.github/workflows/office-correction-disposable-pg17.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261029170000_office_correction_review.sql'
      - 'tests/integration/officeCorrectionReviewFixture.sql'
      - 'tests/integration/officeCorrectionReview.sql'
      - '.github/workflows/office-correction-disposable-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-correction-contract:
    name: Real Office migration and SQL contract on disposable PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: correction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d correction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Load synthetic Supabase auth and Office payment bridge prerequisites
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: correction_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeCorrectionReviewFixture.sql

      - name: Apply the real Office correction review migration
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: correction_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029170000_office_correction_review.sql

      - name: Exercise intake, idempotency, role stages, failure retry and status readback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: correction_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeCorrectionReview.sql
