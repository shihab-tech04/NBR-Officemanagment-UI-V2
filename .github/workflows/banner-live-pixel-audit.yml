name: Read-only banner pixel palette audit
on:
  pull_request:
    paths:
      - 'scripts/banner-live-pixel-audit.ts'
      - '.github/workflows/banner-live-pixel-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-live-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install image decoder only for this audit
        run: npm install --no-save --no-package-lock sharp
      - name: Analyze exact publicly published artwork
        run: npx tsx scripts/banner-live-pixel-audit.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-banner-pixel-audit
          path: banner-live-pixel-audit.json
          if-no-files-found: warn
