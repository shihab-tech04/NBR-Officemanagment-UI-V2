name: Direct Super Admin correction - disposable candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/integration/officeSuperAdminDirectCandidate.sql'
      - 'tests/integration/officeSuperAdminDirectAcceptance.sql'
      - '.github/workflows/office-super-admin-direct-candidate.yml'
permissions:
  contents: read
jobs:
  direct-office-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: correction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d correction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: correction_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install disposable PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Load existing isolated fixtures and migrations
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeCorrectionPaymentParentFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029170000_office_correction_review.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261112210000_office_correction_payment_parent.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261113180000_office_correction_queue_cursor.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114145000_office_correction_acknowledged_audit_provenance.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116042500_office_correction_evidence_projection.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeNoticeRecoveryFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261116054000_office_correction_initiation.sql
          psql -X -v ON_ERROR_STOP=1 -c 'alter table auth.users add column email_confirmed_at timestamptz, add column deleted_at timestamptz, add column is_anonymous boolean not null default false, add column banned_until timestamptz'
      - name: Exercise direct Admin candidate on disposable database only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeSuperAdminDirectCandidate.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeSuperAdminDirectAcceptance.sql
