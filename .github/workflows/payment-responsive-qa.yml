name: Payment responsive browser and design QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run seven-page viewport and accessibility smoke
        run: npx playwright test --config playwright.config.ts
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-responsive-visual-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 30