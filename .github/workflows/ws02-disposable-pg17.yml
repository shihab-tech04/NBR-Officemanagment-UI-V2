name: WS02 disposable PostgreSQL 17 capability (no deployment)
on:
  pull_request:
    paths:
      - 'ws02/isolated_pg17_capability_smoke.sql'
      - 'ws02/isolated_owner_receipt_contract.sql'
      - 'ws02/isolated_postgrest_facade_contract.sql'
      - 'ws02/isolated_audit_trace_digest_candidate.sql'
      - 'ws02/evidence/**'
      - '.github/workflows/ws02-disposable-pg17.yml'
  push:
    branches:
      - 'ws02/disposable-pg17-sql-test-runner-20261022'
    paths:
      - 'ws02/isolated_pg17_capability_smoke.sql'
      - 'ws02/isolated_owner_receipt_contract.sql'
      - 'ws02/isolated_postgrest_facade_contract.sql'
      - 'ws02/isolated_audit_trace_digest_candidate.sql'
      - 'ws02/evidence/**'
      - '.github/workflows/ws02-disposable-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-isolated-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ws02_disposable
          POSTGRES_PASSWORD: disposable_pg17_ci_only
          POSTGRES_DB: ws02_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ws02_disposable -d ws02_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ws02_disposable
      PGPASSWORD: disposable_pg17_ci_only
      PGDATABASE: ws02_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Run real disposable PostgreSQL 17 privilege and rollback smoke
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f ws02/isolated_pg17_capability_smoke.sql
      - name: Verify isolated ownership, atomic replay and receipt finalization
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f ws02/isolated_owner_receipt_contract.sql
      - name: Verify real two-session owner-row revocation serialization
        shell: bash
        run: |
          set -euo pipefail
          # Disposable database only; extract committed DDL before synthetic tests.
          awk '/^INSERT INTO ws02_owner.owners\(record_id,assessment_year,actor_id,state\) VALUES/{exit} {print}' ws02/isolated_owner_receipt_contract.sql > /tmp/ws02_owner_ddl.sql
          echo 'COMMIT;' >> /tmp/ws02_owner_ddl.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_owner_ddl.sql >/tmp/ws02_setup.log
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000001','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          cat > /tmp/ws02_owner_session_a.sql <<'SQL'
          BEGIN;
          -- Test the actual atomic RPC, not just its private lock helper.
          -- All rows are synthetic in the disposable PostgreSQL service.
          SET LOCAL ROLE ws02_owner_engine;
          DO $atomic_session$
          DECLARE actor uuid:='60000000-0000-4000-8000-000000000001';
                  record uuid:='50000000-0000-4000-8000-000000000001';
                  idem text:='concurrent-atomic-receipt-00001';
                  req text:=repeat('a',64);
                  receipt text:=repeat('b',64);
                  audit jsonb; reservation jsonb;
          BEGIN
            reservation:=ws02_owner.nbr_reserve_citizen_evaluation(
              actor,record,'2026-27',idem,req,'NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF reservation->>'state' IS DISTINCT FROM 'RESERVED' THEN
              RAISE EXCEPTION 'CONCURRENT_ATOMIC_RESERVATION_FAILED'; END IF;
            audit:=jsonb_build_object(
              'actor_user_id',actor::text,'taxpayer_record_id',record::text,
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',req,'receipt_hash',receipt,
              'idempotency_key',idem,'result_status','NEEDS_FACTS',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF NOT ws02_owner.nbr_commit_evaluation_atomically(
              actor,record,'2026-27',idem,req,receipt,repeat('c',64),
              'NEEDS_FACTS',audit) THEN
              RAISE EXCEPTION 'CONCURRENT_ATOMIC_COMMIT_FAILED'; END IF;
          END $atomic_session$;
          \echo ATOMIC_RECEIPT_LOCK_HELD
          SELECT pg_sleep(6);
          COMMIT;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_owner_session_a.sql > /tmp/ws02_owner_session_a.log 2>&1 &
          holder=$!
          acquired=0
          for i in $(seq 1 80); do
            if grep -q 'ATOMIC_RECEIPT_LOCK_HELD' /tmp/ws02_owner_session_a.log; then acquired=1; break; fi
            if ! kill -0 "$holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$acquired" -ne 1 ]]; then cat /tmp/ws02_owner_session_a.log; exit 1; fi
          set +e
          psql -X -v ON_ERROR_STOP=1 -c "SET lock_timeout='750ms'; UPDATE ws02_owner.owners SET state='REVOKED' WHERE record_id='50000000-0000-4000-8000-000000000001' AND assessment_year='2026-27';" > /tmp/ws02_revoke_attempt.log 2>&1
          revoke_rc=$?
          set -e
          if [[ "$revoke_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_revoke_attempt.log; then cat /tmp/ws02_revoke_attempt.log; exit 1; fi
          active=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ws02_owner.owners WHERE record_id='50000000-0000-4000-8000-000000000001';")
          [[ "$active" == 'ACTIVE' ]] || { echo 'OWNER_CHANGED_WHILE_RECEIPT_LOCK_HELD'; exit 1; }
          wait "$holder"
          # The receipt must have committed exactly once with its audit trace
          # before owner revocation succeeds.
          finalized=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM ws02_owner.slots s JOIN ws02_owner.evaluation_logs e USING(actor_id,record_id,assessment_year,idem_key) WHERE s.idem_key='concurrent-atomic-receipt-00001' AND s.state='FINALIZED' AND s.receipt_hash=repeat('b',64) AND e.result_state='NEEDS_FACTS' AND e.audit_trace->>'income_year'='2025-26' AND e.audit_trace->>'idempotency_key'=s.idem_key;")
          [[ "$finalized" == "1" ]] || { echo 'ATOMIC_RECEIPT_NOT_COMMITTED_EXACTLY_ONCE'; exit 1; }
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE ws02_owner.owners SET state='REVOKED' WHERE record_id='50000000-0000-4000-8000-000000000001';"
          revoked=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ws02_owner.owners WHERE record_id='50000000-0000-4000-8000-000000000001';")
          [[ "$revoked" == 'REVOKED' ]] || { echo 'REVOCATION_AFTER_COMMIT_FAILED'; exit 1; }
          # Separate two-session rollback proof: a successful atomic call must
          # leave NO persisted receipt, slot or trace if its transaction aborts.
          # This is synthetic PostgreSQL behavior, not signed JWT revocation.
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000002','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          cat > /tmp/ws02_owner_rollback_session_a.sql <<'SQL'
          BEGIN;
          SET LOCAL ROLE ws02_owner_engine;
          DO $atomic_rollback_session$
          DECLARE actor uuid:='60000000-0000-4000-8000-000000000001';
                  record uuid:='50000000-0000-4000-8000-000000000002';
                  idem text:='rollback-atomic-receipt-00001';
                  req text:=repeat('a',64); receipt text:=repeat('b',64);
                  audit jsonb; reservation jsonb;
          BEGIN
            reservation:=ws02_owner.nbr_reserve_citizen_evaluation(
              actor,record,'2026-27',idem,req,'NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF reservation->>'state' IS DISTINCT FROM 'RESERVED' THEN
              RAISE EXCEPTION 'ROLLBACK_RESERVATION_FAILED'; END IF;
            audit:=jsonb_build_object(
              'actor_user_id',actor::text,'taxpayer_record_id',record::text,
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',req,'receipt_hash',receipt,
              'idempotency_key',idem,'result_status','NEEDS_FACTS',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF NOT ws02_owner.nbr_commit_evaluation_atomically(
              actor,record,'2026-27',idem,req,receipt,repeat('c',64),
              'NEEDS_FACTS',audit) THEN
              RAISE EXCEPTION 'ROLLBACK_ATOMIC_COMMIT_CALL_FAILED'; END IF;
          END $atomic_rollback_session$;
          \echo ATOMIC_ROLLBACK_LOCK_HELD
          SELECT pg_sleep(6);
          ROLLBACK;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_owner_rollback_session_a.sql > /tmp/ws02_owner_rollback_session_a.log 2>&1 &
          rollback_holder=$!
          rollback_acquired=0
          for i in $(seq 1 80); do
            if grep -q 'ATOMIC_ROLLBACK_LOCK_HELD' /tmp/ws02_owner_rollback_session_a.log; then rollback_acquired=1; break; fi
            if ! kill -0 "$rollback_holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$rollback_acquired" -ne 1 ]]; then cat /tmp/ws02_owner_rollback_session_a.log; exit 1; fi
          set +e
          psql -X -v ON_ERROR_STOP=1 -c "SET lock_timeout='750ms'; UPDATE ws02_owner.owners SET state='REVOKED' WHERE record_id='50000000-0000-4000-8000-000000000002' AND assessment_year='2026-27';" > /tmp/ws02_rollback_revoke_attempt.log 2>&1
          rollback_revoke_rc=$?
          set -e
          if [[ "$rollback_revoke_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_rollback_revoke_attempt.log; then cat /tmp/ws02_rollback_revoke_attempt.log; exit 1; fi
          wait "$rollback_holder"
          rollback_owner=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ws02_owner.owners WHERE record_id='50000000-0000-4000-8000-000000000002';")
          [[ "$rollback_owner" == 'ACTIVE' ]] || { echo 'OWNER_CHANGED_BEFORE_ROLLBACK'; exit 1; }
          rollback_rows=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='rollback-atomic-receipt-00001') + (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='rollback-atomic-receipt-00001');")
          [[ "$rollback_rows" == '0' ]] || { echo 'ATOMIC_ROLLBACK_LEFT_ORPHAN_SLOT_OR_TRACE'; exit 1; }
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE ws02_owner.owners SET state='REVOKED' WHERE record_id='50000000-0000-4000-8000-000000000002';"
          rollback_revoked=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT state FROM ws02_owner.owners WHERE record_id='50000000-0000-4000-8000-000000000002';")
          [[ "$rollback_revoked" == 'REVOKED' ]] || { echo 'OWNER_REVOCATION_AFTER_ROLLBACK_FAILED'; exit 1; }
          echo 'TWO_SESSION_ATOMIC_RECEIPT_ROLLBACK_NO_ORPHANS_PASS_ONLY'
          # Real two-session same-key race: an uncommitted reservation must
          # block the competing actor call, then replay/conflict must fail closed.
          # Synthetic PG17 only; this does not validate signed Auth tokens.
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000003','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          cat > /tmp/ws02_idempotency_session_a.sql <<'SQL'
          BEGIN;
          SET LOCAL ROLE ws02_owner_engine;
          DO $idem_first$
          DECLARE outcome jsonb;
          BEGIN
            outcome:=ws02_owner.nbr_reserve_citizen_evaluation(
              '60000000-0000-4000-8000-000000000001',
              '50000000-0000-4000-8000-000000000003',
              '2026-27','same-key-two-session-00001',repeat('a',64),
              'NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF outcome->>'state' IS DISTINCT FROM 'RESERVED' THEN
              RAISE EXCEPTION 'FIRST_CONCURRENT_IDEMPOTENCY_RESERVATION_FAILED'; END IF;
          END $idem_first$;
          \echo IDEMPOTENCY_UNCOMMITTED_SLOT_HELD
          SELECT pg_sleep(6);
          COMMIT;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_idempotency_session_a.sql > /tmp/ws02_idempotency_a.log 2>&1 &
          idem_holder=$!
          idem_acquired=0
          for i in $(seq 1 80); do
            if grep -q 'IDEMPOTENCY_UNCOMMITTED_SLOT_HELD' /tmp/ws02_idempotency_a.log; then idem_acquired=1; break; fi
            if ! kill -0 "$idem_holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$idem_acquired" -ne 1 ]]; then cat /tmp/ws02_idempotency_a.log; exit 1; fi
          set +e
          psql -X -v ON_ERROR_STOP=1 -c "SET lock_timeout='750ms'; SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000003','2026-27','same-key-two-session-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW');" > /tmp/ws02_idempotency_collision.log 2>&1
          idem_collision_rc=$?
          set -e
          if [[ "$idem_collision_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_idempotency_collision.log; then cat /tmp/ws02_idempotency_collision.log; exit 1; fi
          wait "$idem_holder"
          idem_replay=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000003','2026-27','same-key-two-session-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$idem_replay" == 'REPLAY_NOT_ACCEPTED' ]] || { echo "CONCURRENT_IDEMPOTENCY_REPLAY_NOT_DENIED: $idem_replay"; exit 1; }
          idem_conflict=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000003','2026-27','same-key-two-session-00001',repeat('d',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$idem_conflict" == 'CONFLICT' ]] || { echo "CONCURRENT_IDEMPOTENCY_HASH_CONFLICT_NOT_DENIED: $idem_conflict"; exit 1; }
          idem_rows=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-key-two-session-00001' AND state='RESERVED' AND receipt_hash IS NULL)::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-key-two-session-00001')::text;")
          [[ "$idem_rows" == '1:0' ]] || { echo "CONCURRENT_IDEMPOTENCY_SLOT_OR_TRACE_DUPLICATED: $idem_rows"; exit 1; }
          echo 'TWO_SESSION_IDEMPOTENCY_UNCOMMITTED_COLLISION_REPLAY_CONFLICT_PASS_ONLY'
          # Rollback/retry counterpart to the committed collision test above.
          # A timed-out contender must not poison an idempotency key when
          # the first transaction aborts. This tests only synthetic PG17.
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000004','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          cat > /tmp/ws02_idem_abort_session_a.sql <<'SQL'
          BEGIN;
          SET LOCAL ROLE ws02_owner_engine;
          DO $idem_abort$
          DECLARE outcome jsonb;
          BEGIN
            outcome:=ws02_owner.nbr_reserve_citizen_evaluation(
              '60000000-0000-4000-8000-000000000001',
              '50000000-0000-4000-8000-000000000004',
              '2026-27','same-key-aborted-first-00001',repeat('a',64),
              'NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF outcome->>'state' IS DISTINCT FROM 'RESERVED' THEN
              RAISE EXCEPTION 'ABORTED_FIRST_RESERVATION_FAILED'; END IF;
          END $idem_abort$;
          \echo IDEMPOTENCY_ABORTABLE_SLOT_HELD
          SELECT pg_sleep(6);
          ROLLBACK;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_idem_abort_session_a.sql > /tmp/ws02_idem_abort_a.log 2>&1 &
          abort_holder=$!
          abort_acquired=0
          for i in $(seq 1 80); do
            if grep -q 'IDEMPOTENCY_ABORTABLE_SLOT_HELD' /tmp/ws02_idem_abort_a.log; then abort_acquired=1; break; fi
            if ! kill -0 "$abort_holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$abort_acquired" -ne 1 ]]; then cat /tmp/ws02_idem_abort_a.log; exit 1; fi
          set +e
          psql -X -v ON_ERROR_STOP=1 -c "SET lock_timeout='750ms'; SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000004','2026-27','same-key-aborted-first-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW');" > /tmp/ws02_idem_abort_collision.log 2>&1
          abort_collision_rc=$?
          set -e
          if [[ "$abort_collision_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_idem_abort_collision.log; then cat /tmp/ws02_idem_abort_collision.log; exit 1; fi
          wait "$abort_holder"
          pre_retry=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-key-aborted-first-00001')::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-key-aborted-first-00001')::text;")
          [[ "$pre_retry" == '0:0' ]] || { echo "ABORTED_RESERVATION_LEFT_ORPHANS: $pre_retry"; exit 1; }
          retry_state=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000004','2026-27','same-key-aborted-first-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$retry_state" == 'RESERVED' ]] || { echo "RETRY_AFTER_ABORT_NOT_RESERVED: $retry_state"; exit 1; }
          retry_replay=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000004','2026-27','same-key-aborted-first-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$retry_replay" == 'REPLAY_NOT_ACCEPTED' ]] || { echo "RETRY_REPLAY_NOT_DENIED: $retry_replay"; exit 1; }
          post_retry=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-key-aborted-first-00001' AND state='RESERVED' AND receipt_hash IS NULL)::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-key-aborted-first-00001')::text;")
          [[ "$post_retry" == '1:0' ]] || { echo "RETRY_AFTER_ABORT_SLOT_OR_TRACE_BAD: $post_retry"; exit 1; }
          echo 'TWO_SESSION_IDEMPOTENCY_ABORT_RETRY_NO_GHOST_SLOT_PASS_ONLY'

          # Concurrent atomic FINALIZATION of one pre-reserved synthetic key.
          # Distinct from the earlier reservation race: a second transaction
          # must not write another receipt or audit while the first holds the
          # slot row lock, or after the first commits. No real Auth/JWT tested.
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000005','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          atomic_race_reserved=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000005','2026-27','same-atomic-finalize-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$atomic_race_reserved" == 'RESERVED' ]] || { echo "ATOMIC_RACE_SETUP_NOT_RESERVED: $atomic_race_reserved"; exit 1; }
          cat > /tmp/ws02_atomic_finalize_a.sql <<'SQL'
          BEGIN;
          SET LOCAL ROLE ws02_owner_engine;
          DO $finalize_first$
          DECLARE audit jsonb;
          BEGIN
            audit:=jsonb_build_object(
              'actor_user_id','60000000-0000-4000-8000-000000000001',
              'taxpayer_record_id','50000000-0000-4000-8000-000000000005',
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',repeat('a',64),
              'receipt_hash',repeat('b',64),
              'idempotency_key','same-atomic-finalize-00001',
              'result_status','FAIL_CLOSED',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF NOT ws02_owner.nbr_commit_evaluation_atomically(
              '60000000-0000-4000-8000-000000000001',
              '50000000-0000-4000-8000-000000000005',
              '2026-27','same-atomic-finalize-00001',
              repeat('a',64),repeat('b',64),repeat('c',64),
              'FAIL_CLOSED',audit) THEN
              RAISE EXCEPTION 'FIRST_ATOMIC_FINALIZATION_DENIED'; END IF;
          END $finalize_first$;
          \echo ATOMIC_FINALIZATION_UNCOMMITTED_LOCK_HELD
          SELECT pg_sleep(6);
          COMMIT;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_finalize_a.sql > /tmp/ws02_atomic_finalize_a.log 2>&1 &
          atomic_holder=$!
          atomic_acquired=0
          for i in $(seq 1 80); do
            if grep -q 'ATOMIC_FINALIZATION_UNCOMMITTED_LOCK_HELD' /tmp/ws02_atomic_finalize_a.log; then atomic_acquired=1; break; fi
            if ! kill -0 "$atomic_holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$atomic_acquired" -ne 1 ]]; then cat /tmp/ws02_atomic_finalize_a.log; exit 1; fi
          cat > /tmp/ws02_atomic_finalize_b.sql <<'SQL'
          SET lock_timeout='750ms';
          SET ROLE ws02_owner_engine;
          SELECT ws02_owner.nbr_commit_evaluation_atomically(
            '60000000-0000-4000-8000-000000000001',
            '50000000-0000-4000-8000-000000000005',
            '2026-27','same-atomic-finalize-00001',
            repeat('a',64),repeat('b',64),repeat('c',64),
            'FAIL_CLOSED',jsonb_build_object(
              'actor_user_id','60000000-0000-4000-8000-000000000001',
              'taxpayer_record_id','50000000-0000-4000-8000-000000000005',
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',repeat('a',64),
              'receipt_hash',repeat('b',64),
              'idempotency_key','same-atomic-finalize-00001',
              'result_status','FAIL_CLOSED',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW'));
          SQL
          set +e
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_finalize_b.sql > /tmp/ws02_atomic_finalize_b.log 2>&1
          atomic_collision_rc=$?
          set -e
          if [[ "$atomic_collision_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_atomic_finalize_b.log; then cat /tmp/ws02_atomic_finalize_b.log; exit 1; fi
          wait "$atomic_holder"
          atomic_replay=$(psql -X -At -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_finalize_b.sql | tail -n 1)
          [[ "$atomic_replay" == 'f' ]] || { echo "SECOND_ATOMIC_FINALIZATION_NOT_REJECTED: $atomic_replay"; exit 1; }
          atomic_counts=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-atomic-finalize-00001' AND state='FINALIZED' AND receipt_hash=repeat('b',64))::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-atomic-finalize-00001' AND receipt_hash=repeat('b',64) AND trace_hash=repeat('c',64) AND result_state='FAIL_CLOSED' AND audit_trace->>'income_year'='2025-26')::text;")
          [[ "$atomic_counts" == '1:1' ]] || { echo "ATOMIC_FINALIZATION_DUPLICATE_OR_MISSING_TRACE: $atomic_counts"; exit 1; }
          echo 'TWO_SESSION_ATOMIC_FINALIZATION_LOCK_REPLAY_EXACTLY_ONE_TRACE_PASS_ONLY'
          # Competing finalization after an ABORTED first finalization: the
          # committed reservation must survive, but the rolled-back receipt and
          # JSONB audit must not. A different session may then finalize once.
          # Synthetic PG17 only; no hosted JWT or real taxpayer authorization.
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO ws02_owner.owners(record_id,assessment_year,actor_id,state) VALUES ('50000000-0000-4000-8000-000000000006','2026-27','60000000-0000-4000-8000-000000000001','ACTIVE');"
          abort_finalize_reserve=$(psql -X -At -v ON_ERROR_STOP=1 -c "SET ROLE ws02_owner_engine; SELECT ws02_owner.nbr_reserve_citizen_evaluation('60000000-0000-4000-8000-000000000001','50000000-0000-4000-8000-000000000006','2026-27','same-atomic-aborted-first-00001',repeat('a',64),'NBR_ENGINE_CITIZEN_V2_REVIEW')->>'state';" | tail -n 1)
          [[ "$abort_finalize_reserve" == 'RESERVED' ]] || { echo "ABORT_FINALIZE_SETUP_NOT_RESERVED: $abort_finalize_reserve"; exit 1; }
          cat > /tmp/ws02_atomic_abort_finalize_a.sql <<'SQL'
          BEGIN;
          SET LOCAL ROLE ws02_owner_engine;
          DO $finalize_abort_first$
          DECLARE audit jsonb;
          BEGIN
            audit:=jsonb_build_object(
              'actor_user_id','60000000-0000-4000-8000-000000000001',
              'taxpayer_record_id','50000000-0000-4000-8000-000000000006',
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',repeat('a',64),
              'receipt_hash',repeat('b',64),
              'idempotency_key','same-atomic-aborted-first-00001',
              'result_status','NEEDS_FACTS',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW');
            IF NOT ws02_owner.nbr_commit_evaluation_atomically(
              '60000000-0000-4000-8000-000000000001',
              '50000000-0000-4000-8000-000000000006',
              '2026-27','same-atomic-aborted-first-00001',
              repeat('a',64),repeat('b',64),repeat('c',64),
              'NEEDS_FACTS',audit) THEN
              RAISE EXCEPTION 'FIRST_ABORTABLE_FINALIZATION_DENIED'; END IF;
          END $finalize_abort_first$;
          \echo ATOMIC_ABORTABLE_FINALIZATION_LOCK_HELD
          SELECT pg_sleep(6);
          ROLLBACK;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_abort_finalize_a.sql > /tmp/ws02_atomic_abort_finalize_a.log 2>&1 &
          abort_finalize_holder=$!
          abort_finalize_acquired=0
          for i in $(seq 1 80); do
            if grep -q 'ATOMIC_ABORTABLE_FINALIZATION_LOCK_HELD' /tmp/ws02_atomic_abort_finalize_a.log; then abort_finalize_acquired=1; break; fi
            if ! kill -0 "$abort_finalize_holder" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$abort_finalize_acquired" -ne 1 ]]; then cat /tmp/ws02_atomic_abort_finalize_a.log; exit 1; fi
          cat > /tmp/ws02_atomic_abort_finalize_b.sql <<'SQL'
          SET lock_timeout='750ms';
          SET ROLE ws02_owner_engine;
          SELECT ws02_owner.nbr_commit_evaluation_atomically(
            '60000000-0000-4000-8000-000000000001',
            '50000000-0000-4000-8000-000000000006',
            '2026-27','same-atomic-aborted-first-00001',
            repeat('a',64),repeat('b',64),repeat('c',64),
            'NEEDS_FACTS',jsonb_build_object(
              'actor_user_id','60000000-0000-4000-8000-000000000001',
              'taxpayer_record_id','50000000-0000-4000-8000-000000000006',
              'assessment_year','2026-27','income_year','2025-26',
              'authorized_request_hash',repeat('a',64),
              'receipt_hash',repeat('b',64),
              'idempotency_key','same-atomic-aborted-first-00001',
              'result_status','NEEDS_FACTS',
              'contract_version','NBR_ENGINE_CITIZEN_V2_REVIEW'));
          SQL
          set +e
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_abort_finalize_b.sql > /tmp/ws02_atomic_abort_finalize_b.log 2>&1
          abort_finalize_collision_rc=$?
          set -e
          if [[ "$abort_finalize_collision_rc" -eq 0 ]] || ! grep -q 'lock timeout' /tmp/ws02_atomic_abort_finalize_b.log; then cat /tmp/ws02_atomic_abort_finalize_b.log; exit 1; fi
          wait "$abort_finalize_holder"
          abort_finalize_pre=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-atomic-aborted-first-00001' AND state='RESERVED' AND receipt_hash IS NULL)::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-atomic-aborted-first-00001')::text;")
          [[ "$abort_finalize_pre" == '1:0' ]] || { echo "ABORTED_FINALIZATION_LEFT_GHOST_RECEIPT_OR_TRACE: $abort_finalize_pre"; exit 1; }
          abort_finalize_retry=$(psql -X -At -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_abort_finalize_b.sql | tail -n 1)
          [[ "$abort_finalize_retry" == 't' ]] || { echo "ABORTED_FINALIZATION_RETRY_DENIED: $abort_finalize_retry"; exit 1; }
          abort_finalize_replay=$(psql -X -At -v ON_ERROR_STOP=1 -f /tmp/ws02_atomic_abort_finalize_b.sql | tail -n 1)
          [[ "$abort_finalize_replay" == 'f' ]] || { echo "ABORTED_FINALIZATION_DUPLICATE_ACCEPTED: $abort_finalize_replay"; exit 1; }
          abort_finalize_counts=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM ws02_owner.slots WHERE idem_key='same-atomic-aborted-first-00001' AND state='FINALIZED' AND receipt_hash=repeat('b',64))::text || ':' || (SELECT count(*) FROM ws02_owner.evaluation_logs WHERE idem_key='same-atomic-aborted-first-00001' AND receipt_hash=repeat('b',64) AND trace_hash=repeat('c',64) AND result_state='NEEDS_FACTS' AND audit_trace->>'income_year'='2025-26')::text;")
          [[ "$abort_finalize_counts" == '1:1' ]] || { echo "ABORTED_FINALIZATION_RETRY_TRACE_OR_RECEIPT_MISMATCH: $abort_finalize_counts"; exit 1; }
          echo 'TWO_SESSION_ABORTED_FINALIZATION_RETRY_EXACTLY_ONE_TRACE_PASS_ONLY'
          # Remove role-owned default ACL records as well as schema objects; otherwise
          # PostgreSQL correctly refuses to drop the synthetic definer roles.
          psql -X -v ON_ERROR_STOP=1 -c 'DROP SCHEMA ws02_owner CASCADE; DROP OWNED BY ws02_owner_rpc, ws02_owner_lock; DROP ROLE ws02_owner_engine; DROP ROLE ws02_owner_rpc; DROP ROLE ws02_owner_lock; DROP ROLE ws02_owner_auth; DROP ROLE ws02_owner_anon;' >/dev/null
          echo 'TWO_SESSION_ATOMIC_RECEIPT_OWNER_REVOCATION_SERIALIZATION_PASS_ONLY'
