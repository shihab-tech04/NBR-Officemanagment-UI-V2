name: Payments UI integration checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Payment navigation and fixture tests
        run: npx vitest run src/test/paymentsNavigation.test.ts src/test/paymentNoticeDetailNavigation.test.ts src/test/paymentNoticeDetailRoute.test.tsx src/app/pages/payments/__tests__/paymentReference.test.ts src/app/pages/payments/__tests__/paymentScenarioModel.test.ts src/app/pages/payments/__tests__/story1TaxpayerProjection.test.ts
      - name: Notification session read state and verified SQL amount regressions
        run: npx vitest run src/app/services/__tests__/demoNotificationReadState.test.ts src/app/store/__tests__/paymentSqlNotifications.test.ts src/test/notificationHistoryNavigation.test.ts
      - name: Compile project for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /NBR-Officemanagment-UI-V2/
