name: Design system internal contract QA

on:
  pull_request:
    paths:
      - "src/app/components/buttons/**"
      - "src/app/components/appearance/**"
      - "src/app/components/modals/AppModal.tsx"
      - "src/app/components/shared/ResponsiveOverlay.tsx"
      - "src/app/hooks/useOverlayScrollLock.ts"
      - "src/app/hooks/__tests__/useOverlayScrollLock.test.tsx"
      - ".github/workflows/design-system-internal-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check shared component compatibility
        run: npm test -- src/app/components/buttons/__tests__/buttonCompatibility.test.tsx src/app/hooks/__tests__/useOverlayScrollLock.test.tsx
      - name: Check all six themes, four fonts, and three size choices
        run: npm test -- src/app/components/appearance/__tests__/appearanceRegistryCompatibility.test.tsx
      - name: Run repository unit tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Verify exact integrated UX change scope (not visual acceptance)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" --depth=1
          node scripts/ux-pr-scope-check.mjs --self-test
          node scripts/ux-pr-scope-check.mjs --check --base "${{ github.event.pull_request.base.sha }}"
