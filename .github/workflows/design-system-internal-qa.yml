name: Design system internal contract QA

on:
  pull_request:
    paths:
      - "src/app/components/buttons/**"
      - "src/app/components/modals/AppModal.tsx"
      - "src/app/components/shared/ResponsiveOverlay.tsx"
      - "src/app/hooks/useOverlayScrollLock.ts"
      - "src/app/hooks/__tests__/useOverlayScrollLock.test.tsx"
      - ".github/workflows/design-system-internal-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check shared component compatibility
        run: npm test -- --run src/app/components/buttons/__tests__/buttonCompatibility.test.tsx src/app/hooks/__tests__/useOverlayScrollLock.test.tsx
      - name: Run repository unit tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Verify forbidden application areas unchanged in this PR
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" --depth=1 || true
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/changed-paths.txt
          if grep -E '^(src/app/data/|src/app/store/|src/styles/|src/locales/|supabase/|sql/)' /tmp/changed-paths.txt; then
            echo 'FAIL: an appearance, data, store, locale or SQL path changed in a structural-only PR'
            exit 1
          fi
          echo 'PASS: no forbidden application paths changed'
