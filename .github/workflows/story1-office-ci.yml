name: Story 1 Office UI Build
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/pages/payments/**'
      - 'supabase/functions/demo-story1-office/**'
      - 'tests/integration/officeStoryMirrorProofHttp.mjs'
      - 'supabase/migrations/**'
      - 'tests/integration/story1OfficeMigrations.sql'
      - 'tests/integration/story1ApprovedFixtureRead.sql'
      - 'tests/integration/officeCorrectionReview.sql'
      - 'tests/integration/officeReturnCombinedMirror.sql'
      - '.github/workflows/story1-office-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Confirm Office mirror requires Taxpayer proof before network or SQL
        run: node tests/integration/officeStoryMirrorProofHttp.mjs
      - run: npm run build
        env:
          BASE_PATH: /NBR-Officemanagment-UI-V2/
  sql-migrations:
    name: Disposable Office SQL and eight simulated services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Bootstrap only disposable API roles and apply ordered Office migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c 'create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;'
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeMigrationAuthPrerequisite.sql
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
          test "${#migrations[@]}" -gt 0
          printf 'Applying %s active Office migration files\n' "${#migrations[@]}"
          for sql in "${migrations[@]}"; do
            echo "Applying $sql"
            psql -X -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Verify eight categories, idempotency, notices and authorization transitions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/story1OfficeMigrations.sql
      - name: Verify approved fixture visibility and Travel Tax masking (rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/story1ApprovedFixtureRead.sql
      - name: Verify TaxPay correction intake, Office roles, decision outbox and readback
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeCorrectionReview.sql
      - name: Verify Return-only combined 30KB Office mirror, retry and legacy limits (rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/officeReturnCombinedMirror.sql
