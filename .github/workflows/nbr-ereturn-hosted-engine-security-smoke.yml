name: NBR eReturn hosted engine security smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nbr-ereturn-hosted-engine-security-smoke.yml'
      - 'ops/security/probe-nbr-ereturn-hosted-engine.mjs'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate probe syntax
        run: node --check ops/security/probe-nbr-ereturn-hosted-engine.mjs
      - name: Verify deployed GET observations and safe non-existent-year POST denials
        run: node ops/security/probe-nbr-ereturn-hosted-engine.mjs
