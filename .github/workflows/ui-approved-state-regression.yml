name: UI Approved-State Regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guard's negative and dependency tests
        run: node scripts/ui-regression-guard.mjs --self-test
      - name: Verify all affected accepted UI states
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BASE"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          node scripts/ui-regression-guard.mjs --check --base "$BASE"
      - name: Preserve source-impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ui-impact-report
          path: test-results/ui-impact-report.json
          if-no-files-found: ignore
